<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In-Network Provider Search — Chat UI Prototype</title>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <div class="toolbar">
    <h1>In-Network Provider Search · Chat UI</h1>
    <div class="group">
      <span class="tb-label">View</span>
      <button class="tb-btn active" id="viewFlow" onclick="setView('flow')">Chat flow</button>
      <button class="tb-btn" id="viewLib" onclick="setView('library')">Component set</button>
    </div>
    <div class="group" id="deviceGroup">
      <span class="tb-label">Device</span>
      <button class="tb-btn active" id="devMobile" onclick="setDevice('mobile')">Mobile</button>
      <button class="tb-btn" id="devDesktop" onclick="setDevice('desktop')">Desktop</button>
    </div>
    <div class="group">
      <span class="tb-label">Flow</span>
      <button class="tb-btn" onclick="restartFlow()">↺ Restart</button>
      <button class="tb-btn" id="autoBtn" onclick="toggleAuto()">▶ Auto-play</button>
    </div>
    <div class="spacer"></div>
    <div class="group">
      <button class="tb-btn active" id="annoBtn" onclick="toggleAnno()">Annotations</button>
    </div>
  </div>

  <div class="main">
    <div class="stage">
      <div class="lib-canvas" id="libCanvas" hidden></div>
      <div class="device mobile" id="device">
        <div class="statusbar"><span>9:41</span><span class="notch"></span><span class="icons">▮▮ ⌁ ▉</span></div>
        <div class="app-header">
          <button class="close" aria-label="Close">✕</button>
          <span class="app-tab active">Conversation</span>
          <span class="app-tab">Takeaways</span>
          <span class="more">⋯</span>
        </div>
        <div class="chat-scroll" id="chat"></div>
        <div class="composer">
          <button class="plus" aria-label="Add">+</button>
          <div class="field">
            <input id="composerInput" placeholder="Ask anything..." aria-label="Message">
            <span class="mic">🎙</span>
          </div>
        </div>
      </div>
    </div>

    <aside class="anno" id="anno">
      <div class="anno-tabs">
        <button class="active" id="tabFlow" onclick="setAnnoTab('flow')">1 · Scenario flow</button>
        <button id="tabComp" onclick="setAnnoTab('comp')">2 · Component usage</button>
      </div>
      <div class="anno-body" id="annoBody"></div>
    </aside>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
